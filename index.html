<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>باشگاه تمرکز و دیسپلین</title>
    <style>
        :root {
            /* تم روشن پیش‌فرض */
            --bg-color: #f4f4f9;
            --text-color: #1a1a1a;
            --card-bg: #ffffff;
            --btn-bg: #e0e0e0;
            --btn-active: #d0d0d0;
            --accent: #2c3e50;
        }

        [data-theme="dark"] {
            /* تم تاریک */
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --card-bg: #1e1e1e;
            --btn-bg: #2d2d2d;
            --btn-active: #404040;
            --accent: #4da6ff;
        }

        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; transition: background-color 0.3s, color 0.3s; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
        }

        /* هدر: کرونومتر و دکمه تم */
        .header {
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            opacity: 0.7;
        }

        .theme-toggle {
            cursor: pointer;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.5rem;
        }

        /* مرکز: نمایش سوال */
        .arena {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .question-box {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 5px;
            margin-bottom: 20px;
            direction: ltr; /* برای نمایش صحیح اعداد در کنار هم */
        }

        .answer-box {
            font-size: 3rem;
            min-height: 60px;
            min-width: 150px;
            text-align: center;
            border-bottom: 3px solid var(--accent);
            color: var(--accent);
            font-weight: bold;
        }

        /* پایین: کیبورد اختصاصی */
        .numpad {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            background-color: var(--card-bg);
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
        }

        .numpad button {
            background-color: var(--btn-bg);
            color: var(--text-color);
            border: none;
            padding: 20px;
            font-size: 1.8rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            user-select: none;
        }

        .numpad button:active { background-color: var(--btn-active); transform: scale(0.95); }
        .btn-submit { grid-column: span 2; background-color: var(--accent) !important; color: white !important; }
        
        [data-theme="dark"] .numpad { box-shadow: 0 -5px 20px rgba(0,0,0,0.5); }
    </style>
</head>
<body data-theme="dark"> <!-- پیش‌فرض تم تاریک تنظیم شده است -->

    <div class="header">
        <button class="theme-toggle" id="themeBtn">☀️</button>
        <div id="stopwatch">۰۰:۰۰</div>
        <div id="progress">۱/۵</div>
    </div>

    <div class="arena">
        <div class="question-box" id="question">82 - 49 =</div>
        <div class="answer-box" id="answer"></div>
    </div>

    <div class="numpad" id="numpad">
        <button data-val="1">۱</button>
        <button data-val="2">۲</button>
        <button data-val="3">۳</button>
        <button data-val="4">۴</button>
        <button data-val="5">۵</button>
        <button data-val="6">۶</button>
        <button data-val="7">۷</button>
        <button data-val="8">۸</button>
        <button data-val="9">۹</button>
        <button class="btn-clear" id="clearBtn">⌫</button>
        <button data-val="0">۰</button>
        <button class="btn-submit" id="submitBtn">تأیید</button>
    </div>

    <script>
        // منطق تغییر تم
        const body = document.body;
        const themeBtn = document.getElementById('themeBtn');
        themeBtn.addEventListener('click', () => {
            if (body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
                themeBtn.textContent = '🌙';
            } else {
                body.setAttribute('data-theme', 'dark');
                themeBtn.textContent = '☀️';
            }
        });

        // منطق کیبورد اختصاصی
        const answerBox = document.getElementById('answer');
        const numButtons = document.querySelectorAll('.numpad button[data-val]');
        const clearBtn = document.getElementById('clearBtn');

        numButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                // تبدیل عدد به فرمت مناسب و نمایش در کادر
                const val = e.target.getAttribute('data-val');
                answerBox.textContent += val;
            });
        });

        clearBtn.addEventListener('click', () => {
            let currentStr = answerBox.textContent;
            answerBox.textContent = currentStr.slice(0, -1);
        });

        // اکشن دکمه تأیید (فعلاً فقط پاک می‌کند تا در فاز بک‌اند به دیتابیس وصل شود)
        document.getElementById('submitBtn').addEventListener('click', () => {
            if(answerBox.textContent !== "") {
                console.log("پاسخ ثبت شده:", answerBox.textContent);
                answerBox.textContent = "";
                // اینجا در فاز بعد، منطق بررسی درستی پاسخ و رفتن به سوال بعد اضافه می‌شود
            }
        });
    </script>
</body>
</html>
