name: Cut Peppa Audio Clips

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Cut 59 clips from audio/epX_full.mp3
        run: |
          python3 - << 'EOF'
          import os, subprocess

          OUTPUT_DIR = "audio"
          PADDING_START = 0.20
          PADDING_END = 0.25

          CLIPS = [
              (1, "ep1_01.mp3", "00:00:35.880", "00:00:36.880"),
              (1, "ep1_02.mp3", "00:00:38.580", "00:00:40.860"),
              (1, "ep1_03.mp3", "00:01:00.680", "00:01:04.940"),
              (1, "ep1_04.mp3", "00:01:16.670", "00:01:19.110"),
              (1, "ep1_05.mp3", "00:01:54.470", "00:01:55.730"),
              (1, "ep1_06.mp3", "00:02:22.860", "00:02:25.000"),
              (1, "ep1_07.mp3", "00:02:57.200", "00:03:00.380"),
              (1, "ep1_08.mp3", "00:03:07.440", "00:03:08.560"),
              (1, "ep1_09.mp3", "00:03:10.520", "00:03:12.100"),
              (1, "ep1_10.mp3", "00:03:12.780", "00:03:16.000"),
              (1, "ep1_11.mp3", "00:03:27.320", "00:03:29.120"),
              (1, "ep1_12.mp3", "00:03:39.620", "00:03:41.920"),
              (1, "ep1_13.mp3", "00:03:43.020", "00:03:45.540"),
              (1, "ep1_14.mp3", "00:03:48.100", "00:03:53.100"),
              (2, "ep2_01.mp3", "00:00:44.780", "00:00:45.500"),
              (2, "ep2_02.mp3", "00:02:03.600", "00:02:05.320"),
              (2, "ep2_03.mp3", "00:02:15.680", "00:02:18.440"),
              (2, "ep2_04.mp3", "00:02:31.840", "00:02:33.600"),
              (2, "ep2_05.mp3", "00:02:41.180", "00:02:43.180"),
              (2, "ep2_06.mp3", "00:02:58.820", "00:03:02.740"),
              (2, "ep2_07.mp3", "00:03:04.100", "00:03:12.800"),
              (2, "ep2_08.mp3", "00:03:49.980", "00:03:52.500"),
              (2, "ep2_09.mp3", "00:03:53.060", "00:03:56.320"),
              (2, "ep2_10.mp3", "00:04:03.120", "00:04:07.160"),
              (3, "ep3_01.mp3", "00:00:53.140", "00:00:59.120"),
              (3, "ep3_02.mp3", "00:01:03.819", "00:01:05.420"),
              (3, "ep3_03.mp3", "00:01:26.300", "00:01:28.140"),
              (3, "ep3_04.mp3", "00:02:07.419", "00:02:09.300"),
              (3, "ep3_05.mp3", "00:02:13.100", "00:02:14.160"),
              (3, "ep3_06.mp3", "00:02:15.000", "00:02:16.500"),
              (3, "ep3_07.mp3", "00:02:27.420", "00:02:29.780"),
              (3, "ep3_08.mp3", "00:03:10.880", "00:03:14.020"),
              (3, "ep3_09.mp3", "00:03:23.960", "00:03:24.940"),
              (3, "ep3_10.mp3", "00:03:27.760", "00:03:31.160"),
              (3, "ep3_11.mp3", "00:03:34.280", "00:03:35.860"),
              (3, "ep3_12.mp3", "00:03:37.740", "00:03:38.780"),
              (3, "ep3_13.mp3", "00:03:39.600", "00:03:41.460"),
              (3, "ep3_14.mp3", "00:04:09.480", "00:04:10.220"),
              (3, "ep3_15.mp3", "00:04:21.019", "00:04:22.620"),
              (4, "ep4_01.mp3", "00:00:48.300", "00:00:49.640"),
              (4, "ep4_02.mp3", "00:01:44.280", "00:01:47.360"),
              (4, "ep4_03.mp3", "00:02:15.920", "00:02:21.120"),
              (4, "ep4_04.mp3", "00:02:26.280", "00:02:27.880"),
              (4, "ep4_05.mp3", "00:02:39.050", "00:02:41.050"),
              (4, "ep4_06.mp3", "00:03:34.670", "00:03:38.750"),
              (4, "ep4_07.mp3", "00:03:52.250", "00:03:56.550"),
              (4, "ep4_08.mp3", "00:04:16.880", "00:04:22.020"),
              (5, "ep5_01.mp3", "00:00:35.360", "00:00:38.880"),
              (5, "ep5_02.mp3", "00:00:57.440", "00:00:59.260"),
              (5, "ep5_03.mp3", "00:01:02.440", "00:01:03.819"),
              (5, "ep5_04.mp3", "00:01:06.260", "00:01:09.060"),
              (5, "ep5_05.mp3", "00:01:53.500", "00:01:56.020"),
              (5, "ep5_06.mp3", "00:02:46.150", "00:02:47.870"),
              (5, "ep5_07.mp3", "00:02:50.690", "00:02:53.070"),
              (5, "ep5_08.mp3", "00:02:54.270", "00:02:57.050"),
              (5, "ep5_09.mp3", "00:03:30.350", "00:03:33.110"),
              (5, "ep5_10.mp3", "00:03:37.070", "00:03:39.090"),
              (5, "ep5_11.mp3", "00:03:59.580", "00:04:02.600"),
              (5, "ep5_12.mp3", "00:04:03.920", "00:04:07.120"),
              (6, "ep6_01.mp3", "00:00:30.510", "00:00:33.690"),
              (6, "ep6_02.mp3", "00:00:35.070", "00:00:39.810"),
              (6, "ep6_03.mp3", "00:00:41.030", "00:00:42.390"),
              (6, "ep6_04.mp3", "00:00:42.890", "00:00:46.050"),
              (6, "ep6_05.mp3", "00:00:55.930", "00:00:56.610"),
              (6, "ep6_06.mp3", "00:01:07.980", "00:01:11.280"),
              (6, "ep6_07.mp3", "00:01:59.130", "00:02:01.030"),
              (6, "ep6_08.mp3", "00:02:18.530", "00:02:20.570"),
              (6, "ep6_09.mp3", "00:02:37.610", "00:02:39.250"),
              (6, "ep6_10.mp3", "00:02:39.910", "00:02:41.970"),
              (6, "ep6_11.mp3", "00:02:48.990", "00:02:53.030"),
              (6, "ep6_12.mp3", "00:03:50.030", "00:03:54.450"),
              (6, "ep6_13.mp3", "00:03:58.190", "00:04:02.070"),
              (6, "ep6_14.mp3", "00:04:12.670", "00:04:14.370"),
              (6, "ep6_15.mp3", "00:04:28.130", "00:04:30.890"),
          ]

          def to_seconds(ts):
              h, m, s = ts.split(":")
              return int(h) * 3600 + int(m) * 60 + float(s)

          for ep_num, out_name, start_ts, end_ts in CLIPS:
              src = os.path.join(OUTPUT_DIR, f"ep{ep_num}_full.mp3")
              if not os.path.exists(src):
                  print(f"[SKIP] {src} not found")
                  continue
              start_sec = max(0.0, to_seconds(start_ts) - PADDING_START)
              end_sec = to_seconds(end_ts) + PADDING_END
              duration = max(0.2, end_sec - start_sec)
              out_path = os.path.join(OUTPUT_DIR, out_name)
              subprocess.run([
                  "ffmpeg", "-y", "-hide_banner", "-loglevel", "error",
                  "-ss", f"{start_sec:.3f}", "-i", src, "-t", f"{duration:.3f}",
                  "-vn", "-ac", "1", "-b:a", "64k", "-ar", "44100", out_path
              ], check=True)
              print(f"[OK] {out_name}")
          EOF

      - name: Commit and push clips
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audio/ep*_*.mp3
          git commit -m "Add 59 Peppa network audio clips" || echo "No changes"
          git push
