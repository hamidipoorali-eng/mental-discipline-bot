name: Cut Peppa Audio Clips

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Cut key clips from peppa_db.json
        run: |
          python3 - << 'EOF'
          import os, json, subprocess

          OUTPUT_DIR = "audio"
          PADDING_START = 0.20
          PADDING_END = 0.25

          def to_seconds(ts):
              h, m, s = ts.strip().split(":")
              return int(h) * 3600 + int(m) * 60 + float(s)

          with open("peppa_db.json", "r", encoding="utf-8") as f:
              db = json.load(f)

          created = 0
          skipped = 0

          for ep in db.get("episodes", []):
              ep_id = ep["id"]
              full_name = ep.get("full_audio", f"ep{ep_id}_full.mp3")
              src = os.path.join(OUTPUT_DIR, full_name)

              for clip in ep.get("clips", []):
                  out_name = clip.get("audio", "")
                  start_ts = clip.get("start", "").strip()
                  end_ts = clip.get("end", "").strip()

                  if not out_name or not start_ts or not end_ts:
                      skipped += 1
                      continue

                  out_path = os.path.join(OUTPUT_DIR, out_name)
                  if os.path.exists(out_path):
                      skipped += 1
                      continue

                  if not os.path.exists(src):
                      print(f"[MISSING SOURCE] {src} for {out_name}")
                      skipped += 1
                      continue

                  start_sec = max(0.0, to_seconds(start_ts) - PADDING_START)
                  end_sec = to_seconds(end_ts) + PADDING_END
                  duration = max(0.2, end_sec - start_sec)

                  subprocess.run([
                      "ffmpeg", "-y", "-hide_banner", "-loglevel", "error",
                      "-ss", f"{start_sec:.3f}", "-i", src, "-t", f"{duration:.3f}",
                      "-vn", "-ac", "1", "-b:a", "64k", "-ar", "44100", out_path
                  ], check=True)
                  created += 1
                  print(f"[OK] {out_name} ({duration:.1f}s)")

          print(f"Done! Created: {created}, Skipped/Existing: {skipped}")
          EOF

      - name: Commit and push new clips
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audio/*.mp3
          git commit -m "Auto-cut new Peppa key audio clips from peppa_db.json" || echo "No new clips"
          git push
